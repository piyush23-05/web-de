<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connect Four</title>

<link rel="stylesheet" href="proj4.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

<header>

<h1>🔴 Connect Four 🟡</h1>

<div class="scoreboard">

<div class="score red">

<h3>Red</h3>

<p id="redScore">0</p>

</div>

<div class="score yellow">

<h3>Yellow</h3>

<p id="yellowScore">0</p>

</div>

</div>

</header>

<div class="controls">

<button id="restartBtn">


</button>

<button id="themeBtn">

</button>

</div>

<h2 id="turnText">

Red Player Turn

</h2>

<div id="board">

</div>

<div id="winnerPopup" class="popup hidden">

<h2 id="winnerText">

Winner

</h2>

<button id="playAgain">

Play Again

</button>

</div>

<audio id="dropSound">

<source src="sounds/drop.mp3" type="audio/mpeg">

</audio>

<audio id="winSound">

<source src="sounds/win.mp3" type="audio/mpeg">

</audio>

</div>

<script src="proj4.js"></script>

</body>

</html>
